name: GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veröffentlichungen nicht abbrechen, aber nur eine gleichzeitig
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Seite vorbereiten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests
        run: npm test

      - name: Icons und Einzeldatei bauen
        run: npm run build

      - name: Verzeichnisauflistung unterbinden
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
